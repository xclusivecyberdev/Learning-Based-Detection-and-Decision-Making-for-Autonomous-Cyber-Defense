version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    format: "%(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: results/logs/app.log
    maxBytes: 10485760
    backupCount: 5

root:
  level: DEBUG
  handlers: [console, file]

loggers:
  src.agent:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  src.models:
    level: INFO
    handlers: [console]
    propagate: false
